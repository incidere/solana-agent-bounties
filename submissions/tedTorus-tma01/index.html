<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMA-01: Neon Ricochet</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { width: 390px; height: 844px; background: #050510; box-shadow: 0 0 30px rgba(0,255,255,0.1); }
    </style>
</head>
<body>
    <canvas id="c" width="390" height="844"></canvas>
    <script>
        // Deterministic PRNG (Mulberry32)
        class PRNG {
            constructor(s) { this.s = s; }
            next() {
                let t = this.s += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }
        
        const ctx = document.getElementById('c').getContext('2d');
        let prng, state, particles = [], shake = 0;

        function spawnParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                let a = prng.next() * Math.PI * 2;
                let s = prng.next() * 4 + 1;
                particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, c: color});
            }
        }

        window.__GAME = {
            reset: (s) => {
                prng = new PRNG(s);
                particles = [];
                shake = 0;
                state = {
                    phase: 'play', wave: 1, score: 0, combo: 0, game_over: false, awaiting_revive: false,
                    balls: [{x: 195, y: 750, vx: 0, vy: 0, active: false}],
                    blocks: [], lastDown: false,
                    stats: { dmg: 1, pierce: false }
                };
                for(let i=0; i<5; i++) state.blocks.push({x: 35+i*65, y: 100, w: 60, h: 30, hp: 1});
            },
            step: (dt, inp) => {
                if (state.game_over) return;
                
                if (state.awaiting_revive) {
                    if (inp.tap) { 
                        state.awaiting_revive = false; 
                        state.blocks = []; 
                        state.phase = 'play'; 
                    }
                    return;
                }

                if (state.phase === 'draft') {
                    if (inp.choice !== null && inp.choice !== undefined) {
                        if (inp.choice === 0) state.stats.dmg++;
                        else if (inp.choice === 1) state.stats.pierce = true;
                        else state.balls.push({x: 195, y: 750, vx: 0, vy: 0, active: false});
                        state.phase = 'play';
                        state.wave++;
                        let rows = Math.min(5, Math.ceil(state.wave/2));
                        for(let r=0; r<rows; r++) {
                            for(let i=0; i<5; i++) {
                                if(prng.next() > 0.3) {
                                    state.blocks.push({x: 35+i*65, y: 100 + r*40, w: 60, h: 30, hp: state.wave});
                                }
                            }
                        }
                    }
                }

                let justReleased = state.lastDown && !inp.down;
                state.lastDown = inp.down;

                if (state.phase === 'play') {
                    let allIdle = state.balls.every(b => !b.active);
                    if (allIdle && justReleased) {
                        let tx = inp.x * 390, ty = inp.y * 844;
                        state.balls.forEach((b, idx) => {
                            let dx = tx - b.x, dy = ty - b.y;
                            let dist = Math.hypot(dx, dy) || 1;
                            let speed = 0.9;
                            b.vx = (dx/dist) * speed;
                            b.vy = (dy/dist) * speed;
                            b.active = true;
                            b.x -= b.vx * (idx * 20);
                            b.y -= b.vy * (idx * 20);
                        });
                    }

                    let activeCount = 0;
                    state.balls.forEach(b => {
                        if (!b.active) return;
                        activeCount++;
                        b.x += b.vx * dt;
                        b.y += b.vy * dt;
                        
                        if(b.x < 8 || b.x > 382) { b.vx *= -1; b.x = Math.max(8, Math.min(382, b.x)); }
                        if(b.y < 8) { b.vy *= -1; b.y = 8; }
                        if(b.y > 844) {
                            b.active = false;
                            b.x = 195; b.y = 750;
                        }

                        for(let i=state.blocks.length-1; i>=0; i--) {
                            let bl = state.blocks[i];
                            let cx = Math.max(bl.x, Math.min(b.x, bl.x + bl.w));
                            let cy = Math.max(bl.y, Math.min(b.y, bl.y + bl.h));
                            let dx = b.x - cx, dy = b.y - cy;
                            if(dx*dx + dy*dy < 64) {
                                bl.hp -= state.stats.dmg;
                                state.score += 10;
                                shake = 6;
                                spawnParticles(cx, cy, '#0ff');
                                if(!state.stats.pierce) {
                                    if(Math.abs(dx) > Math.abs(dy)) b.vx *= -1;
                                    else b.vy *= -1;
                                }
                                if(bl.hp <= 0) state.blocks.splice(i, 1);
                            }
                        }
                    });

                    if (activeCount === 0 && !allIdle) {
                        state.blocks.forEach(bl => bl.y += 40);
                        if (state.blocks.some(bl => bl.y > 700)) {
                            state.awaiting_revive = true;
                        } else {
                            state.phase = 'draft';
                        }
                    }
                }

                // Render Phase
                ctx.save();
                if(shake > 0) {
                    ctx.translate((prng.next()-0.5)*shake, (prng.next()-0.5)*shake);
                    shake *= 0.85;
                    if(shake < 0.5) shake = 0;
                }
                ctx.fillStyle = '#050510';
                ctx.fillRect(0,0,390,844);

                if(state.phase === 'play' && state.balls.every(b=>!b.active) && inp.down) {
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath(); ctx.moveTo(195, 750); ctx.lineTo(inp.x*390, inp.y*844); ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.fillStyle = '#0ff';
                state.balls.forEach(b => {
                    ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
                });

                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                state.blocks.forEach(bl => {
                    let ratio = Math.min(1, bl.hp / Math.max(1, state.wave));
                    ctx.fillStyle = `rgb(${255*ratio}, 0, ${255*(1-ratio)})`;
                    ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
                    ctx.fillStyle = '#fff';
                    ctx.fillText(bl.hp, bl.x + bl.w/2, bl.y + 20);
                });

                for(let i=particles.length-1; i>=0; i--) {
                    let p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                    if(p.life <= 0) { particles.splice(i,1); continue; }
                    ctx.fillStyle = p.c;
                    ctx.globalAlpha = p.life;
                    ctx.fillRect(p.x, p.y, 4, 4);
                    ctx.globalAlpha = 1;
                }

                if(state.phase === 'draft') {
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,390,844);
                    ctx.fillStyle = '#fff'; ctx.fillText("DRAFT UPGRADE", 195, 200);
                    ['+1 DMG', 'PIERCE', '+1 BALL'].forEach((t, i) => {
                        ctx.fillStyle = inp.choice === i ? '#0ff' : '#333';
                        ctx.fillRect(50, 300 + i*100, 290, 80);
                        ctx.fillStyle = '#fff';
                        ctx.fillText(t, 195, 345 + i*100);
                    });
                }

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'left';
                ctx.fillText(`Wave: ${state.wave}  Score: ${state.score}`, 10, 30);
                ctx.restore();
            },
            state: () => JSON.parse(JSON.stringify(state))
        };
        window.__GAME.reset(12345);
    </script>
</body>
</html>
